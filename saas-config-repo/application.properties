# =====================================================================
# CONFIGURACION GLOBAL (compartida por todos los microservicios)
# Los datasource y hosts dependientes del ambiente se definen en
# application-{local|dev|prod}.properties
# Por defecto el cliente arranca con profile=local
# =====================================================================

# ---------------------------------------------------------------------
# JPA estandar (cada servicio decide ddl-auto en su propio archivo)
# ---------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
# Mantener nombres tal cual los declara la entidad (PascalCase). Sin esto,
# Hibernate convertiria CamelCase -> snake_case automaticamente.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# ---------------------------------------------------------------------
# Eureka (defaults; cada profile lo sobrescribe segun ambiente)
# ---------------------------------------------------------------------
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${spring.application.name}
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# ---------------------------------------------------------------------
# JWT (compartido)
# ---------------------------------------------------------------------
jwt.secret=${JWT_SECRET:SuperClaveUltraSeguraDe32Caracteres1234}
jwt.expirationMs=${JWT_EXPIRATION_MS:3600000}
jwt.refreshTokenExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ---------------------------------------------------------------------
# Redis (rate-limit en gateway, JWT blacklist en auth)
# ---------------------------------------------------------------------
spring.data.redis.timeout=2000

# ---------------------------------------------------------------------
# Logging y formato
# ---------------------------------------------------------------------
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# ---------------------------------------------------------------------
# Kafka + Outbox
# ---------------------------------------------------------------------
saas.kafka.enabled=true
saas.outbox.topic=domain.events
saas.outbox.relay-enabled=true
saas.outbox.poll-delay-ms=2000
saas.outbox.batch-size=100
saas.outbox.max-retries=5

# =====================================================================
# POOL DE CONEXIONES (HikariCP)
# ---------------------------------------------------------------------
# El presupuesto real: MySQL arranca con max_connections=200 y SEIS
# servicios abren pool (auth, system, business, finance, events,
# thirdparty). search y gateway no tocan JPA.
#
# El default de Hikari no es "10 conexiones": es maximum-pool-size=10 Y
# minimum-idle=10. Sesenta conexiones abiertas de forma permanente, cada
# una con su hilo y sus buffers del lado de MySQL, se usen o no. Ese era
# el gasto invisible en una maquina con recursos contados.
#
# Con 8/2 quedan 12 conexiones en reposo y 48 en el pico absoluto. El
# techo util de un pool no es "cuantas quepan" sino el paralelismo real
# que hay detras: mas conexiones que trabajo concurrente solo anaden
# contencion en el servidor, nunca rendimiento.
# =====================================================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
# Una conexion ociosa se devuelve al minuto, no acampa media hora.
spring.datasource.hikari.idle-timeout=60000
# Por debajo del wait_timeout de MySQL y de cualquier proxy intermedio:
# recicla el pool antes de que se la corten por debajo y el primer uso
# despues de un rato largo falle con "connection is closed".
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.pool-name=${spring.application.name}-pool
# Una conexion retenida mas de 30s casi siempre es una fuga, no una query.
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_MS:30000}
# Autocommit apagado + provider_disables_autocommit: Hibernate deja de
# pedir la conexion antes de tiempo y se ahorra el SET autocommit en cada
# transaccion. Es un viaje de red por transaccion, y son todas.
spring.datasource.hikari.auto-commit=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# =====================================================================
# PARAMETROS JDBC COMPARTIDOS
# ---------------------------------------------------------------------
# Se declaran una sola vez y cada profile los pega a su URL. Sin cache de
# sentencias preparadas, MySQL vuelve a parsear la MISMA consulta en cada
# llamada: es el gasto de CPU mas facil de eliminar que tiene el sistema.
# =====================================================================
saas.jdbc.params=useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&useLocalSessionState=true&maintainTimeStats=false&cacheServerConfiguration=true

# =====================================================================
# HIBERNATE: MEMORIA Y VIAJES AL SERVIDOR
# =====================================================================
# El cache de planes guarda 2048 consultas compiladas POR SERVICIO. Con
# heaps de 256-512M son decenas de MB que nunca se recuperan, para un
# aplicativo que no tiene 2048 consultas distintas.
spring.jpa.properties.hibernate.query.plan_cache_max_size=256
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=64
# Agrupa inserts/updates en un viaje en vez de uno por fila.
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
# Trae el tamano de pagina que pide la consulta, no la tabla entera.
spring.jpa.properties.hibernate.jdbc.fetch_size=100
# Colecciones LAZY de varias entidades en una sola consulta (mata N+1 sin
# tocar una linea de codigo).
spring.jpa.properties.hibernate.default_batch_fetch_size=25

# =====================================================================
# ANCHO DE BANDA: COMPRESION HTTP
# ---------------------------------------------------------------------
# Las respuestas son JSON, que comprime entre 70% y 85%. Es la mejora de
# banda mas grande del sistema y son cuatro lineas. min-response-size
# evita gastar CPU comprimiendo respuestas que caben en un paquete.
# =====================================================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/hal+json,application/problem+json,text/plain,text/css,text/html,application/javascript
server.compression.min-response-size=1024

# =====================================================================
# HILOS HTTP
# ---------------------------------------------------------------------
# Tomcat trae 200 hilos por servicio. Detras hay un pool de 8 conexiones:
# los 192 restantes no pueden hacer nada mas que esperar turno, y cada uno
# reserva su pila. Se recorta a lo que el pool puede alimentar de verdad.
# =====================================================================
server.tomcat.threads.max=${HTTP_THREADS_MAX:50}
server.tomcat.threads.min-spare=${HTTP_THREADS_MIN:5}
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000

# La direccion publica de la API, la que se le da a Meta como webhook de
# WhatsApp. No se puede deducir: dentro del contenedor la direccion es otra,
# y adivinarla acertaria en desarrollo y daria una URL falsa en produccion.
saas.api.public-url=${SAAS_API_PUBLIC_URL:http://localhost:8080}
