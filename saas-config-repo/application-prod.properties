# =====================================================================
# PROFILE: PROD
# Todas las credenciales y hosts vienen de variables de entorno.
# Activacion: SPRING_PROFILES_ACTIVE=prod
# =====================================================================

# ---------------------------------------------------------------------
# Base de datos
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# Pool de conexiones (HikariCP)
# ---------------------------------------------------------------------
# El resto del pool se hereda de application.properties. Aqui solo se
# sube el techo, porque en prod hay mas concurrencia real.
#
# Antes esto fijaba 20/5 en duro: seis servicios daban 120 conexiones de
# techo y 30 permanentes contra un MySQL de 200. Se quedaba sin margen
# para la consola, los backups y el propio Flyway al arrancar.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:12}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:3}

# En prod el pool NO delata fugas por consola: cuesta y ensucia el log.
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_MS:0}

# ---------------------------------------------------------------------
# Eureka
# ---------------------------------------------------------------------
eureka.client.service-url.defaultZone=${EUREKA_URL}

# ---------------------------------------------------------------------
# Redis
# ---------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.saas=INFO

# ---------------------------------------------------------------------
# CORS prod: lista cerrada de orígenes; obligatorio definir CORS_ORIGINS
# en variables de entorno. Acepta patrones (https://*.tu-dominio.com).
# ---------------------------------------------------------------------
saas.cors.allowed-origins=${CORS_ORIGINS}
