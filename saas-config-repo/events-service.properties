server.port=8087

# Sin context-path: este servicio sirve DOS prefijos publicos (/audit y
# /notification) y Spring solo admite uno. El prefijo lo ponen los
# controladores. El gateway pasa las rutas sin reescribir, asi que ambas
# apuntan a lb://events-service.

# ---------------------------------------------------------------------
# Persistencia: ESQUEMA DEDICADO saas_events (aisla auditoria y notificaciones
# de la BD operativa). events-service gobierna su propia BD con Flyway
# (init-scripts solo crea la BD vacia saas_events).
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${SAAS_DB_HOST:localhost}:3306/saas_events?${saas.jdbc.params}&createDatabaseIfNotExist=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-version=0: si saas_events no estuviera vacío, Flyway baseliza en 0 y
# AÚN aplica V1 (evita el caso clásico en que baseline=1 se "come" la V1 y
# nunca crea audit_log).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate

# Auditoria JPA ACTIVA: las tablas de notificacion extienden BaseEntity, cuyo
# AuditDate es NOT NULL y lo rellena AuditingEntityListener. audit_log no se ve
# afectada: no extiende BaseEntity y pone su CreatedAt a mano.
saas.jpa.auditing-enabled=true

# ---------------------------------------------------------------------
# Outbox: events-service solo CONSUME. No produce ni relaya.
# ---------------------------------------------------------------------
saas.outbox.relay-enabled=false
saas.outbox.publisher-enabled=false
saas.kafka.enabled=false

# ---------------------------------------------------------------------
# Kafka consumer: grupo PROPIO para no competir con otros consumidores.
# Lee el topic dedicado de auditoria.
# ---------------------------------------------------------------------
saas.outbox.audit-topic=audit.events
spring.kafka.consumer.group-id=audit-recorder

# Segundo consumidor: el topic general de dominio, del que solo interesa
# notification.requested. Grupo PROPIO: si compartiera el de auditoria, los dos
# competirian por las mismas particiones y cada mensaje llegaria a uno solo.
saas.outbox.topic=domain.events
saas.notification.group-id=notification-sender
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=3

# ---------------------------------------------------------------------
# Cache / Logging
# ---------------------------------------------------------------------
spring.cache.type=none
logging.level.org.springframework.security=INFO
