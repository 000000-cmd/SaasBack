server.port=8099

# ---------------------------------------------------------------------
# Prefijo publico del servicio (estandar: toda URL arranca con /<micro>).
# El gateway pasa el path tal cual; Spring lo despoja al matchear controllers.
# ---------------------------------------------------------------------
server.servlet.context-path=/thirdparty

# ---------------------------------------------------------------------
# ESQUEMA `personas`
# ---------------------------------------------------------------------
# Este servicio NO vive en saas_db: gobierna el esquema de datos
# personales (third_party y sus contactos, direcciones y cuentas).
#
# Es la misma frontera que ya tiene events-service con saas_events: quien
# quiera saber quien es alguien pasa por aqui, y no hay clave foranea que
# cruce de un esquema al otro.
#
# Las tablas las crea auth-service con Flyway (crea los dos esquemas en su
# V1); aqui solo se valida que las entidades JPA coincidan.
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${SAAS_DB_HOST:localhost}:3306/personas?${saas.jdbc.params}

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate

# ---------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------
spring.cache.type=none

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.org.springframework.security=INFO
