# =====================================================================
# EVENTS-SERVICE · PERFIL LOCAL
# Override de datasource a la BD DEDICADA saas_events.
#
# Por qué este archivo y no events-service.properties:
#   En Spring Cloud Config, una propiedad en un archivo *profile-specific*
#   (application-local.properties) gana sobre un archivo de servicio SIN perfil
#   (events-service.properties). Por eso el datasource caía en saas_db.
#   Este archivo es service + profile => máxima precedencia y gana siempre.
# =====================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/saas_events?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&createDatabaseIfNotExist=true
